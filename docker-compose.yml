name: slipgauge-registry

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: slipgauge
      POSTGRES_USER: slipgauge
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD:-slipgauge}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/tuning.conf:/etc/postgresql/conf.d/tuning.conf:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slipgauge -d slipgauge']
      interval: 5s
      timeout: 3s
      retries: 12

  registry-service:
    build:
      context: .
      dockerfile: registry-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REGISTRY_DB_URL: postgres://postgres:5432/slipgauge
      REGISTRY_DB_USER: slipgauge
      REGISTRY_DB_PASSWORD: ${REGISTRY_DB_PASSWORD:-slipgauge}
      # No default. A service that boots with a shipped key is a service
      # somebody will deploy with a shipped key.
      REGISTRY_JWT_SECRET: ${REGISTRY_JWT_SECRET:?a signing key is required}
      REGISTRY_ALLOWED_ORIGINS: ${REGISTRY_ALLOWED_ORIGINS:-http://localhost:4200}
      LAB_ACCREDITATION_REF: ${LAB_ACCREDITATION_REF:?the schedule reference is printed on certificates}
      LAB_NAME: ${LAB_NAME:-Slipgauge Metrology}
      # The interval procedure's four numbers. Left at the defaults the class
      # table carries unless the laboratory has written down otherwise.
      REGISTRY_INTERVAL_PASSES: ${REGISTRY_INTERVAL_PASSES:-2}
      REGISTRY_INTERVAL_EXTENSION_STEP: ${REGISTRY_INTERVAL_EXTENSION_STEP:-0.15}
      REGISTRY_INTERVAL_FAILURE_FACTOR: ${REGISTRY_INTERVAL_FAILURE_FACTOR:-0.5}
      REGISTRY_INTERVAL_DRIFT_BRAKE: ${REGISTRY_INTERVAL_DRIFT_BRAKE:-0.7}
      # Never on in a real deployment. The compose file is used for a demo as
      # often as for anything else, so it is a variable rather than a comment.
      REGISTRY_DEMO_ESTATE: ${REGISTRY_DEMO_ESTATE:-false}
    ports:
      - '8080:8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

    # The service holds its rate limiter and its sign in counter in memory, so
    # a second replica would double every allowance. One replica is deliberate
    # and the note is in rate-limit.ts.
    deploy:
      replicas: 1

  registry-console:
    build:
      context: .
      dockerfile: registry-console/Dockerfile
    depends_on:
      registry-service:
        condition: service_healthy
    ports:
      - '4200:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/index.html >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6

  # Reads the room loggers off the laboratory network and posts them at the
  # service. Not started by default: it needs the loggers to be reachable, and
  # a demo on a laptop cannot see them.
  logger-poller:
    profiles: ['loggers']
    build:
      context: .
      dockerfile: registry-service/Dockerfile
    depends_on:
      registry-service:
        condition: service_healthy
    command: ['node', 'dist/tools/logger-poll.js']
    environment:
      REGISTRY_API: http://registry-service:8080/api
      REGISTRY_LOGGER_HOST: ${REGISTRY_LOGGER_HOST:-}
      REGISTRY_LOGGER_TOKEN: ${REGISTRY_LOGGER_TOKEN:-}
    restart: unless-stopped

volumes:
  pgdata:
