name: container images

on:
  push:
    branches: [main]
    paths:
      - 'registry-service/**'
      - 'registry-console/**'
      - 'ops/**'
      - 'docker-compose.yml'
      - '.github/workflows/images.yml'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: registry-service
            dockerfile: registry-service/Dockerfile
          - image: registry-console
            dockerfile: registry-console/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed. There is nowhere to push to yet, and a build
      # that only runs on the day of a release is a build that breaks on the
      # day of a release.
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: slipgauge/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: check the image actually starts
        if: matrix.image == 'registry-console'
        run: |
          docker run --detach --name console --publish 8080:8080 \
            slipgauge/registry-console:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/index.html >/dev/null; then
              echo "console served its index"
              docker rm -f console
              exit 0
            fi
            sleep 2
          done
          docker logs console
          docker rm -f console
          exit 1
