name: registry-console

on:
  push:
    branches: [main]
    paths:
      - 'registry-console/**'
      - 'tests/frontend/**'
      - '.github/workflows/console.yml'
  pull_request:
    paths:
      - 'registry-console/**'
      - 'tests/frontend/**'

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: registry-console/package-lock.json

      - name: install
        working-directory: registry-console
        run: npm ci

      - name: lint
        working-directory: registry-console
        run: npm run lint

      - name: typecheck
        working-directory: registry-console
        run: npm run typecheck

      - name: unit tests
        working-directory: registry-console
        run: npm test -- --ci --coverage

      - name: production build
        working-directory: registry-console
        run: npm run build

      # A bundle that has quietly doubled is a bundle somebody has to load over
      # the laboratory's own network, and nobody notices until it is four
      # megabytes. The number is generous; it is a tripwire, not a budget.
      - name: check the bundle has not run away
        working-directory: registry-console
        run: |
          bytes=$(du -sb dist/registry-console/browser | cut -f1)
          echo "the browser bundle is $bytes bytes"
          if [ "$bytes" -gt 6000000 ]; then
            echo "the bundle is over six megabytes, work out what went in" >&2
            exit 1
          fi

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-coverage
          path: registry-console/coverage/
          retention-days: 7
