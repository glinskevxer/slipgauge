<div class="shell">
  <header class="shell__bar">
    <a class="shell__mark" routerLink="/overview">
      <span class="shell__mark-name">Slipgauge</span>
      <span class="shell__mark-kind">calibration registry</span>
    </a>

    <nav class="shell__nav" aria-label="Sections">
      @for (entry of navigation(); track entry.path) {
        <a
          class="shell__nav-link"
          [routerLink]="entry.path"
          routerLinkActive="shell__nav-link--active"
          [title]="entry.hint"
          >{{ entry.label }}</a
        >
      }
    </nav>

    <div class="shell__who">
      @if (session.signedIn()) {
        <span class="shell__name">{{ session.displayName() }}</span>
        <button class="shell__out" type="button" (click)="signOut()">Sign out</button>
      } @else {
        <a class="shell__out" routerLink="/sign-in">Sign in</a>
      }
    </div>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
