# Settings for a single node running the registry. The estate is small, a few
# hundred thousand rows at most, so the point of these is predictable latency
# on the recall board rather than throughput.

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 128MB

# The recall board and the impact cascade are both index driven, and the
# planner was choosing sequential scans with the default page cost on SSD.
random_page_cost = 1.1
effective_io_concurrency = 200

max_connections = 60
checkpoint_completion_target = 0.9
wal_compression = on

# Anything slower than a second on this schema is a missing index.
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
