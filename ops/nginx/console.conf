# The console is a single page application behind the same origin as the API,
# so every unknown path has to fall through to index.html and /api has to be
# proxied rather than served.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed bundles never change under the same name.
    location ~* \.(?:js|css|woff2|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached or a deploy takes an hour to reach a bench.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://registry-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The health and metrics endpoints sit outside /api because a scraper is
    # not an API caller. They are proxied here so a probe pointed at the
    # console reaches the service rather than the single page fallback.
    location = /health {
        proxy_pass http://registry-service:8080/health;
        access_log off;
    }

    location = /health/readiness {
        proxy_pass http://registry-service:8080/health/readiness;
        access_log off;
    }

    # Metrics are for the laboratory's own scraper on the internal network and
    # must not be reachable from a bench browser.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://registry-service:8080/metrics;
        access_log off;
    }

    # A logger upload is a few thousand samples of JSON and a bulk import is a
    # spreadsheet. Both go past the default body limit, and both are refused
    # with a 413 that says nothing useful when they do.
    location = /api/environment/readings {
        client_max_body_size 8m;
        proxy_pass http://registry-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location = /api/instruments/import {
        client_max_body_size 8m;
        proxy_pass http://registry-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # The console loads nothing from anywhere else. Written out rather than
    # left to a default so a future dependency that wants a font from a CDN
    # fails here, where somebody has to think about it, rather than silently
    # putting a bench terminal on the open internet.
    add_header Content-Security-Policy
        "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # A certificate is printed from the browser and the print stylesheet is
    # part of the bundle, so nothing here may strip it.
    client_body_timeout 30s;
    send_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
